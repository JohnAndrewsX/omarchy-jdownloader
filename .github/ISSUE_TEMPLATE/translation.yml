name: Translation
description: Add or fix a language in Lang.js
title: "Translation: <language>"
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language and tag
      placeholder: "Français — fr"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Fixes to existing strings, or "I will open a pull request" — English keys are the source; every key in `STRINGS.en` needs a counterpart
    validations:
      required: false
